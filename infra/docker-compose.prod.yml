# =============================================================================
# Production stack: API + Postgres + Redis + Caddy (TLS reverse proxy).
#
# Build context is the repo root. Run from repo root:
#   cp infra/.env.prod.example infra/.env.prod   # then fill in secrets
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml build
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d
#
# Before going live: pin all third-party images by digest (sha256:...).
# =============================================================================

name: teamslike

networks:
  edge:     # caddy <-> api
  internal: # api <-> postgres/redis (no host exposure)

volumes:
  postgres_data:
  redis_data:
  caddy_data:    # ACME cert state — DO NOT delete
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot migrate. Runs alembic upgrade head, then exits.
  migrate:
    image: ${API_IMAGE:-teamslike-api:latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: "no"
    command: ["migrate"]
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    image: ${API_IMAGE:-teamslike-api:latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - edge
    expose:
      - "8800"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8800/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      CHATWOOT_DOMAIN: ${CHATWOOT_DOMAIN:-support.invalid}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.invalid}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - api
