# =============================================================================
# Jitsi Meet self-host stack (web + prosody + jicofo + jvb).
# Based on upstream jitsi/docker-jitsi-meet. Exposed via shared `teamslike_edge`
# network → Caddy proxies meet.* to here. UDP 10000 is exposed on host for media.
#
# Run from repo root:
#   cp infra/jitsi/.env.example infra/jitsi/.env   # fill secrets
#   docker compose --env-file infra/jitsi/.env -f infra/jitsi/docker-compose.yml up -d
# =============================================================================

name: jitsi

networks:
  jitsi_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16
  edge:
    name: teamslike_edge
    external: true

services:
  web:
    image: jitsi/web:${JITSI_IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_BOSH_URL_BASE: http://prosody:5280
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
    volumes:
      - ${CONFIG}/web:/config:Z
      - ${CONFIG}/web/crontabs:/var/spool/cron/crontabs:Z
      - ${CONFIG}/transcripts:/usr/share/jitsi-meet/transcripts:Z
    networks:
      - jitsi_internal
      - edge
    expose:
      - "80"
    depends_on:
      - prosody

  prosody:
    image: jitsi/prosody:${JITSI_IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      XMPP_MODULES: ""
      XMPP_MUC_MODULES: ""
      XMPP_INTERNAL_MUC_MODULES: ""
    expose:
      - "5222"
      - "5347"
      - "5280"
    volumes:
      - ${CONFIG}/prosody/config:/config:Z
      - ${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    networks:
      jitsi_internal:
        aliases:
          - meet.jitsi
          - auth.meet.jitsi
          - guest.meet.jitsi
          - muc.meet.jitsi
          - internal-muc.meet.jitsi
          - recorder.meet.jitsi

  jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_SERVER: prosody
    volumes:
      - ${CONFIG}/jicofo:/config:Z
    depends_on:
      - prosody
    networks:
      - jitsi_internal

  jvb:
    image: jitsi/jvb:${JITSI_IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_SERVER: prosody
    ports:
      # Media traffic — MUST be reachable from clients on the public internet
      - "10000:10000/udp"
    volumes:
      - ${CONFIG}/jvb:/config:Z
    depends_on:
      - prosody
    networks:
      - jitsi_internal
